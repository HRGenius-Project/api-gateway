server:
  port: 8090

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD:Redis@12345}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

jwt:
  secret: ${JWT_SECRET:hrgenius-super-secret-key-change-in-production-min-32-chars}

management:
  endpoints:
    web:
      exposure:
        include: health,info